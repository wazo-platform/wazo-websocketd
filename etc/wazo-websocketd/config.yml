# This file should not be modified as it may get changed by the maintainer.
# Add extra configuration files to the extra_config_files directory to override
# the settings in this file

# Directory in which to place config overrides
#extra_config_files: /etc/wazo-websocketd/conf.d

## Change the log level to debug level.
#debug: false

## Log file.
#log_file: /var/log/wazo-websocketd.log

## Log level.
#log_level: info

## User to run process as.
#user: wazo-websocketd

## WebSocket server
#websocket:
#
#  # Listening address
#  listen: 0.0.0.0
#
#  # Listening port
#  port: 9502
#
#  ping_interval: 60

## wazo-auth (authentication daemon) connection settings.
#auth:
#  host: localhost
#  port: 80
#  https: false

## Event bus (AMQP) connection settings
#bus:
#  host: localhost
#  port: 5672
#  username: guest
#  password: guest
#  exchange_name: wazo-headers
#  exchange_type: headers

# Token validation goes through the caching broker, falling back to wazo-auth.
# `listen` selects the transport:
#   /path/to.sock -> unix socket, `port` is ignored
#   an IP address -> TCP on `port`
#   empty         -> no broker, validate against wazo-auth directly
# Set `connect` only when workers dial another address than the broker binds.
#broker:
#  listen: null
#  connect: null
#  port: 9506

## Developer options -- do not use them
#auth_check_strategy: dynamic
