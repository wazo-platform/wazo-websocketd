[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wazo-websocketd"
version = "1.0"
description = "Wazo WebSocket daemon"
authors = [{name = "Wazo Authors", email = "dev@wazo.community"}]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"

[project.urls]
Homepage = "http://wazo.community"

[project.scripts]
wazo-websocketd = "wazo_websocketd.main:main"
wazo-websocketd-wait-online = "wazo_websocketd.wait_online:main"

[tool.setuptools.packages.find]
include = ["wazo_websocketd*"]
exclude = ["wazo_websocketd.tests*"]

[tool.black]
skip-string-normalization = true

[tool.flake8]
show-source = true
max-line-length = 99
application-import-names = "wazo_websocketd"
ignore = [
  "W503", # line break before binary operator
]
exclude = [
    ".tox",
    ".eggs",
]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
check_untyped_defs = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
py_version = 311

[tool.pytest.ini_options]
testpaths = ["wazo_websocketd"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
