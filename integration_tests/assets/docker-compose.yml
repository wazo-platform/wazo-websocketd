services:
  sync:
    image: wazoplatform/wait
    environment:
      TIMEOUT: ${INTEGRATION_TEST_TIMEOUT}

  auth:
    image: wazoplatform/wazo-auth-mock
    ports:
      - "9497"

  rabbitmq:
    image: rabbitmq:3
    ports:
      - "5672"

  broker:
    image: wazo-websocketd-test
    command: ["wazo-websocketd-broker", "--status-listen", "0.0.0.0"]
    volumes:
      - "../..:/usr/src/wazo-websocketd"
      - "./etc/wazo-websocketd/conf.d/50-base.yml:/etc/wazo-websocketd/conf.d/50-base.yml"
    ports:
      - "9504"
    environment:
      HOME: "/usr/src/wazo-websocketd"
      XIVO_UUID: "the-predefined-wazo-uuid"

  websocketd:
    image: wazo-websocketd-test
    volumes:
      - "../..:/usr/src/wazo-websocketd"
      - "./etc/wazo-websocketd/conf.d/50-base.yml:/etc/wazo-websocketd/conf.d/50-base.yml"
      # - "${LOCAL_GIT_REPOS}/xivo-lib-python/xivo:/opt/venv/lib/python3.11/site-packages/xivo"
    ports:
      - "9502"
    environment:
      HOME: "/usr/src/wazo-websocketd"
      XIVO_UUID: "the-predefined-wazo-uuid"
